services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: reservation-salles-php:refactor-v0.1.0
    env_file:
      - .env
    volumes:
      - ./:/var/www

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - "8081:80"
    env_file:
      - .env
    depends_on:
      - mysql

volumes:
  mysql_data:
